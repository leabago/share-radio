<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>RadioWave · Bootstrap</title>
    <!-- Bootstrap 5 + Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        /* custom overrides & fine-tuning */
        body {
            background: #0f0f12;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            padding-top: 70px;   /* space for fixed header */
            padding-bottom: 90px; /* space for fixed player */
            min-height: 100vh;
        }

        /* fixed header */
        .app-header-fixed {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1030;
            background: #16161c;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-bottom: 1px solid #2a2a32;
            padding: 0.75rem 1rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }
        .app-header-fixed .brand {
            color: #f0f0f0;
            font-weight: 500;
            font-size: 1.3rem;
            letter-spacing: -0.3px;
        }
        .app-header-fixed .brand i {
            color: #6c8cff;
            margin-right: 8px;
        }

        /* station grid */
        .station-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 1rem;
            margin-top: 0.5rem;
        }
        .station-card {
            background: #1e1e26;
            border: 1px solid #2c2c36;
            border-radius: 24px;
            padding: 1rem 0.5rem 0.8rem;
            text-align: center;
            transition: all 0.15s ease;
            cursor: pointer;
            box-shadow: 0 8px 16px -8px rgba(0,0,0,0.5);
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .station-card:hover {
            transform: translateY(-4px);
            border-color: #6c8cff;
            background: #262630;
        }
        .station-card.active {
            border: 2px solid #6c8cff;
            background: #262a3a;
            box-shadow: 0 0 20px rgba(108, 140, 255, 0.2);
        }
        .station-card .artwork {
            width: 70px;
            height: 70px;
            margin: 0 auto 10px;
            background: #2a2a34;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: #6c8cff;
            border: 1px solid #363642;
            overflow: hidden;
            flex-shrink: 0;
        }
        .station-card .artwork img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .station-card .station-name {
            color: #eee;
            font-weight: 500;
            font-size: 0.95rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }
        .station-card .genre-tag {
            font-size: 0.65rem;
            background: #2e2e3a;
            padding: 0.15rem 0.8rem;
            border-radius: 40px;
            color: #b0b0be;
            display: inline-block;
            margin-top: 4px;
        }
        .station-card .country-flag {
            font-size: 0.7rem;
            color: #8a8a98;
            margin-top: 6px;
        }
        .station-card .play-indicator {
            font-size: 0.7rem;
            color: #6c8cff;
            margin-top: 6px;
        }

        /* filter bar */
        .filter-bar {
            background: #14141a;
            padding: 0.7rem 1rem;
            border-radius: 60px;
            border: 1px solid #2a2a32;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .filter-bar .input-group-text {
            background: #1f1f28;
            border: none;
            color: #8a8a98;
        }
        .filter-bar .form-control,
        .filter-bar .form-select {
            background: #1a1a22;
            border: 1px solid #31313c;
            color: #eee;
            font-size: 0.9rem;
        }
        .filter-bar .form-control:focus,
        .filter-bar .form-select:focus {
            background: #1a1a22;
            border-color: #6c8cff;
            box-shadow: 0 0 0 0.2rem rgba(108, 140, 255, 0.25);
            color: #fff;
        }
        .filter-bar .form-control::placeholder {
            color: #5f5f6e;
        }
        .filter-bar .btn-outline-light {
            border-color: #3a3a46;
            color: #ccc;
        }
        .filter-bar .btn-outline-light:hover {
            background: #2a2a36;
            border-color: #6c8cff;
            color: #fff;
        }

        /* fixed player bar */
        .player-bar-fixed {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 1040;
            background: #14141ad9;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid #2a2a34;
            padding: 0.6rem 1rem;
            box-shadow: 0 -6px 30px rgba(0,0,0,0.7);
        }
        .player-bar-fixed .track-info {
            color: #d0d0da;
            min-width: 0;
        }
        .player-bar-fixed .track-info .station-name {
            color: #f0f0f0;
            font-weight: 500;
            font-size: 1rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .player-bar-fixed .track-info .now-playing-label {
            font-size: 0.7rem;
            color: #7a7a8a;
        }
        .player-bar-fixed .player-controls .btn {
            color: #c0c0ce;
            border: none;
            background: transparent;
            font-size: 1.3rem;
            padding: 0.2rem 0.5rem;
            transition: 0.1s;
        }
        .player-bar-fixed .player-controls .btn:hover {
            color: #fff;
            transform: scale(1.1);
        }
        .player-bar-fixed .player-controls .btn-play {
            background: #6c8cff;
            color: #fff;
            border-radius: 40px;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }
        .player-bar-fixed .player-controls .btn-play:hover {
            background: #5a7ae8;
            transform: scale(0.95);
        }
        .player-bar-fixed .volume-slider {
            width: 80px;
            accent-color: #6c8cff;
            background: #2f2f3c;
            height: 4px;
            border-radius: 10px;
        }
        @media (max-width: 576px) {
            .player-bar-fixed .volume-slider { width: 50px; }
            .station-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
        }

        /* pagination */
        .pagination-custom .page-link {
            background: #1c1c24;
            border-color: #32323e;
            color: #b0b0be;
        }
        .pagination-custom .page-link:hover {
            background: #2a2a36;
            border-color: #6c8cff;
            color: #fff;
        }
        .pagination-custom .page-item.active .page-link {
            background: #6c8cff;
            border-color: #6c8cff;
            color: #fff;
        }
        .pagination-custom .page-item.disabled .page-link {
            background: #14141a;
            color: #4a4a56;
        }

        /* modal */
        .modal-content {
            background: #1d1d26;
            border: 1px solid #353542;
            color: #e0e0ea;
        }
        .modal-header {
            border-bottom: 1px solid #2e2e3c;
        }
        .modal-footer {
            border-top: 1px solid #2e2e3c;
        }
        .modal .form-control {
            background: #13131a;
            border: 1px solid #33333e;
            color: #eee;
        }
        .modal .form-control:focus {
            background: #13131a;
            border-color: #6c8cff;
            box-shadow: 0 0 0 0.2rem rgba(108, 140, 255, 0.2);
            color: #fff;
        }
        .modal .btn-close {
            filter: invert(0.8);
        }
        .btn-primary {
            background: #6c8cff;
            border-color: #6c8cff;
        }
        .btn-primary:hover {
            background: #5a7ae8;
            border-color: #5a7ae8;
        }
        .btn-secondary {
            background: #2c2c38;
            border-color: #3d3d4a;
            color: #ccc;
        }
        .btn-secondary:hover {
            background: #3a3a48;
            color: #fff;
        }

        /* scrollable station list */
        .station-list-container {
            max-height: calc(100vh - 300px);
            overflow-y: auto;
            padding-right: 4px;
        }
        .station-list-container::-webkit-scrollbar {
            width: 6px;
        }
        .station-list-container::-webkit-scrollbar-track {
            background: #1a1a22;
            border-radius: 10px;
        }
        .station-list-container::-webkit-scrollbar-thumb {
            background: #3a3a4a;
            border-radius: 10px;
        }

        /* toast */
        .toast-container {
            z-index: 1060;
        }

        /* image upload preview */
        .image-preview {
            width: 80px;
            height: 80px;
            border-radius: 30px;
            background: #2a2a34;
            border: 1px solid #363642;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-top: 8px;
        }
        .image-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .image-preview .placeholder-icon {
            font-size: 2rem;
            color: #6c8cff;
        }
    </style>
</head>
<body>

<!-- ========== FIXED HEADER ========== -->
<header class="app-header-fixed d-flex align-items-center justify-content-between">
    <div class="brand">
        <i class="bi bi-broadcast"></i> RadioWave
    </div>
    <button class="btn btn-outline-light btn-sm" data-bs-toggle="modal" data-bs-target="#addStationModal">
        <i class="bi bi-plus-circle"></i> Add
    </button>
</header>

<!-- ========== MAIN CONTENT ========== -->
<main class="container-fluid px-3 px-md-4">

    <!-- filter row -->
    <div class="filter-bar d-flex align-items-center justify-content-between flex-wrap">
        <div class="d-flex flex-wrap gap-2 align-items-center w-100">
            <div class="input-group" style="flex: 2 1 180px;">
                <span class="input-group-text"><i class="bi bi-search"></i></span>
                <input type="text" class="form-control" id="searchInput" placeholder="Search stations...">
            </div>
            <div class="d-flex flex-wrap gap-2 align-items-center">
                <select class="form-select form-select-sm" id="genreFilter" style="width:120px;">
                    <option value="">Genre</option>
                    <option value="rock">Rock</option>
                    <option value="jazz">Jazz</option>
                    <option value="pop">Pop</option>
                    <option value="classical">Classical</option>
                    <option value="electronic">Electronic</option>
                    <option value="talk">Talk</option>
                </select>
                <input type="text" class="form-control form-control-sm" id="countryFilter" placeholder="Country" style="width:110px;">
                <button class="btn btn-outline-light btn-sm" id="searchBtn"><i class="bi bi-arrow-right"></i> Go</button>
            </div>
        </div>
    </div>

    <!-- station grid + pagination -->
    <div class="station-list-container">
        <div id="stationGrid" class="station-grid">
            <!-- cards injected -->
        </div>
    </div>

    <!-- pagination -->
    <nav aria-label="Station pagination" class="mt-3 d-flex justify-content-center">
        <ul class="pagination pagination-custom" id="paginationControls">
            <li class="page-item" id="prevPageItem"><a class="page-link" href="#" id="prevPageBtn"><i class="bi bi-chevron-left"></i></a></li>
            <li class="page-item disabled"><a class="page-link" id="pageInfo">1 / 1</a></li>
            <li class="page-item" id="nextPageItem"><a class="page-link" href="#" id="nextPageBtn"><i class="bi bi-chevron-right"></i></a></li>
        </ul>
    </nav>
</main>

<!-- ========== FIXED PLAYER BAR ========== -->
<div class="player-bar-fixed d-flex align-items-center justify-content-between flex-wrap gap-2">
    <div class="track-info d-flex align-items-center gap-2" style="flex: 1 1 150px; min-width:0;">
        <i class="bi bi-headphones" style="color:#6c8cff; font-size:1.4rem;"></i>
        <div class="text-truncate">
            <div class="station-name" id="currentStationName">Select a station</div>
            <div class="now-playing-label"><i class="bi bi-play-circle-fill"></i> live stream</div>
        </div>
    </div>
    <div class="player-controls d-flex align-items-center gap-2 flex-wrap justify-content-end">
        <input type="range" min="0" max="1" step="0.05" value="0.8" class="volume-slider" id="volumeSlider">
        <button class="btn btn-play" id="playPauseBtn"><i class="bi bi-play-fill"></i></button>
        <button class="btn" id="stopBtn"><i class="bi bi-stop-fill"></i></button>
    </div>
</div>

<!-- ========== ADD STATION MODAL ========== -->
<div class="modal fade" id="addStationModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="bi bi-plus-circle" style="color:#6c8cff;"></i> Add radio station</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">Station name *</label>
                    <input type="text" class="form-control" id="stationNameInput" placeholder="e.g. Radio Nova" value="My Station">
                </div>
                <div class="mb-3">
                    <label class="form-label">Stream URL *</label>
                    <input type="text" class="form-control" id="stationUrlInput" placeholder="http://example.com/stream.mp3" value="http://ice1.radiofrance.fr/fip-midfi.mp3">
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Genre</label>
                        <input type="text" class="form-control" id="stationGenreInput" placeholder="rock" value="electronic">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Country</label>
                        <input type="text" class="form-control" id="stationCountryInput" placeholder="France" value="France">
                    </div>
                </div>
                <!-- Image upload -->
                <div class="mb-3">
                    <label class="form-label">Station image (optional)</label>
                    <input type="file" class="form-control" id="stationImageInput" accept="image/*">
                    <div class="image-preview" id="imagePreview">
                        <i class="bi bi-image placeholder-icon"></i>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="submitStationBtn"><i class="bi bi-check-lg"></i> Add station</button>
            </div>
        </div>
    </div>
</div>

<!-- toast container for feedback -->
<div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="liveToast" class="toast align-items-center text-white border-0" role="alert" aria-live="assertive" aria-atomic="true" style="background:#1e1e2a;">
        <div class="d-flex">
            <div class="toast-body" id="toastMessage">Station added!</div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- ========== MAIN JAVASCRIPT ========== -->
<script>
    (function() {
        'use strict';

        // ---- state ----
        let stations = [];
        let currentStationId = null;
        let audioElement = null;
        let isPlaying = false;
        let currentPage = 0;
        const LIMIT = 12;
        let totalStations = 0;

        // DOM refs
        const grid = document.getElementById('stationGrid');
        const searchInput = document.getElementById('searchInput');
        const genreFilter = document.getElementById('genreFilter');
        const countryFilter = document.getElementById('countryFilter');
        const searchBtn = document.getElementById('searchBtn');
        const prevPageBtn = document.getElementById('prevPageBtn');
        const nextPageBtn = document.getElementById('nextPageBtn');
        const pageInfo = document.getElementById('pageInfo');
        const prevPageItem = document.getElementById('prevPageItem');
        const nextPageItem = document.getElementById('nextPageItem');
        const currentStationName = document.getElementById('currentStationName');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const stopBtn = document.getElementById('stopBtn');
        const volumeSlider = document.getElementById('volumeSlider');
        const submitStationBtn = document.getElementById('submitStationBtn');
        const stationNameInput = document.getElementById('stationNameInput');
        const stationUrlInput = document.getElementById('stationUrlInput');
        const stationGenreInput = document.getElementById('stationGenreInput');
        const stationCountryInput = document.getElementById('stationCountryInput');
        const stationImageInput = document.getElementById('stationImageInput');
        const imagePreview = document.getElementById('imagePreview');
        const toastEl = document.getElementById('liveToast');
        const toastMessage = document.getElementById('toastMessage');
        const toast = new bootstrap.Toast(toastEl, { delay: 3000 });

        // ---- helpers ----
        function generateFakeStations(count = 22) {
            const genres = ['rock', 'jazz', 'pop', 'classical', 'electronic', 'talk', 'indie', 'ambient'];
            const countries = ['USA', 'UK', 'Russia', 'France', 'Germany', 'Canada', 'Australia', 'Brazil', 'Japan'];
            const names = ['Radio Nova', 'FIP', 'BBC 6 Music', 'KEXP', 'NTS', 'SomaFM', 'Jazz FM', 'Classic FM', 'Radio Paradise', 'Triple J', 'KCRW', 'WFMU', 'Rinse FM', 'Dublab', 'Lofi Radio', 'Pulse', 'Wave', 'Metro', 'Cosmic', 'Ambient'];
            const list = [];
            for (let i = 0; i < count; i++) {
                const name = names[i % names.length] + (i > 10 ? ' ' + (i+1) : '');
                list.push({
                    id: `station-${Date.now()}-${i}-${Math.random().toString(36).substring(2,6)}`,
                    name: name,
                    url: `https://example.com/stream${i}.mp3`,
                    genre: genres[i % genres.length],
                    country: countries[i % countries.length],
                    added_at: new Date(Date.now() - i * 86400000).toISOString(),
                    image: null // no image for fake stations
                });
            }
            return list;
        }

        function loadStations() {
            const stored = localStorage.getItem('radioStations');
            if (stored) {
                try { stations = JSON.parse(stored); } catch(e) { stations = generateFakeStations(22); }
            } else {
                stations = generateFakeStations(22);
            }
            totalStations = stations.length;
            renderPage(0);
        }

        function persistStations() {
            localStorage.setItem('radioStations', JSON.stringify(stations));
            totalStations = stations.length;
        }

        function getFilteredStations() {
            const search = searchInput.value.toLowerCase().trim();
            const genre = genreFilter.value.toLowerCase().trim();
            const country = countryFilter.value.toLowerCase().trim();
            return stations.filter(st => {
                let match = true;
                if (search) match = match && st.name.toLowerCase().includes(search);
                if (genre) match = match && (st.genre || '').toLowerCase().includes(genre);
                if (country) match = match && (st.country || '').toLowerCase().includes(country);
                return match;
            });
        }

        function escapeHtml(text) {
            if (!text) return '';
            return String(text).replace(/[&<>"]/g, function(m) {
                if (m === '&') return '&amp;'; if (m === '<') return '&lt;'; if (m === '>') return '&gt;'; if (m === '"') return '&quot;';
                return m;
            });
        }

        // ---- render ----
        function renderPage(page) {
            const filtered = getFilteredStations();
            totalStations = filtered.length;
            const start = page * LIMIT;
            const end = Math.min(start + LIMIT, totalStations);
            const pageItems = filtered.slice(start, end);
            currentPage = page;

            grid.innerHTML = '';
            if (pageItems.length === 0) {
                grid.innerHTML = `<div class="text-center text-secondary py-5" style="grid-column:1/-1;">No stations found</div>`;
            } else {
                pageItems.forEach(st => {
                    const card = document.createElement('div');
                    card.className = `station-card ${currentStationId === st.id ? 'active' : ''}`;
                    card.dataset.id = st.id;
                    // image or default icon
                    let artworkHtml = '';
                    if (st.image) {
                        artworkHtml = `<img src="${st.image}" alt="${escapeHtml(st.name)}">`;
                    } else {
                        artworkHtml = `<i class="bi bi-radio"></i>`;
                    }
                    card.innerHTML = `
            <div class="artwork">${artworkHtml}</div>
            <div class="station-name">${escapeHtml(st.name)}</div>
            <span class="genre-tag">${escapeHtml(st.genre || 'mixed')}</span>
            <div class="country-flag"><i class="bi bi-geo-alt"></i> ${escapeHtml(st.country || 'world')}</div>
            <div class="play-indicator">${currentStationId === st.id && isPlaying ? '🔊 playing' : ''}</div>
          `;
                    card.addEventListener('click', () => playStation(st.id));
                    grid.appendChild(card);
                });
            }

            // pagination
            const totalPages = Math.ceil(totalStations / LIMIT) || 1;
            pageInfo.textContent = `${page+1} / ${totalPages}`;
            prevPageItem.classList.toggle('disabled', page === 0);
            nextPageItem.classList.toggle('disabled', page >= totalPages - 1);
        }

        // ---- player ----
        function playStation(stationId) {
            const station = stations.find(s => s.id === stationId);
            if (!station) return;

            if (currentStationId === stationId && audioElement && isPlaying) {
                pauseAudio();
                return;
            }

            if (audioElement) {
                audioElement.pause();
                audioElement.src = '';
                audioElement = null;
                isPlaying = false;
            }

            const audio = new Audio(station.url);
            audio.volume = parseFloat(volumeSlider.value);
            audio.crossOrigin = 'anonymous';
            audio.addEventListener('error', () => {
                showToast('Could not load stream. Check the URL.');
                resetPlayerUI();
            });
            audio.addEventListener('ended', () => {
                // don't auto-replay
            });

            audioElement = audio;
            currentStationId = station.id;
            currentStationName.textContent = station.name;
            playPauseBtn.innerHTML = '<i class="bi bi-pause-fill"></i>';
            isPlaying = true;
            audio.play().catch(() => {});
            renderPage(currentPage);
        }

        function pauseAudio() {
            if (audioElement) {
                audioElement.pause();
                isPlaying = false;
                playPauseBtn.innerHTML = '<i class="bi bi-play-fill"></i>';
                renderPage(currentPage);
            }
        }

        function stopAudio() {
            if (audioElement) {
                audioElement.pause();
                audioElement.src = '';
                audioElement = null;
                isPlaying = false;
                currentStationId = null;
                currentStationName.textContent = 'Select a station';
                playPauseBtn.innerHTML = '<i class="bi bi-play-fill"></i>';
                renderPage(currentPage);
            }
        }

        function resetPlayerUI() {
            if (audioElement) {
                audioElement.pause();
                audioElement.src = '';
                audioElement = null;
            }
            isPlaying = false;
            currentStationId = null;
            currentStationName.textContent = 'Select a station';
            playPauseBtn.innerHTML = '<i class="bi bi-play-fill"></i>';
            renderPage(currentPage);
        }

        function togglePlayPause() {
            if (!audioElement || !currentStationId) {
                const filtered = getFilteredStations();
                if (filtered.length) playStation(filtered[0].id);
                return;
            }
            if (isPlaying) {
                pauseAudio();
            } else {
                if (audioElement) {
                    audioElement.play().catch(() => {});
                    isPlaying = true;
                    playPauseBtn.innerHTML = '<i class="bi bi-pause-fill"></i>';
                    renderPage(currentPage);
                } else {
                    const station = stations.find(s => s.id === currentStationId);
                    if (station) playStation(station.id);
                }
            }
        }

        // ---- add station with image ----
        function addStation(name, url, genre, country, imageData) {
            if (!name.trim() || !url.trim()) {
                showToast('Name and URL are required.');
                return false;
            }
            if (stations.some(s => s.url === url.trim())) {
                showToast('Station with this URL already exists.');
                return false;
            }
            const newStation = {
                id: `station-${Date.now()}-${Math.random().toString(36).substring(2,8)}`,
                name: name.trim(),
                url: url.trim(),
                genre: genre.trim() || 'unknown',
                country: country.trim() || 'world',
                added_at: new Date().toISOString(),
                image: imageData || null
            };
            stations.push(newStation);
            persistStations();
            renderPage(currentPage);
            showToast(`Station "${newStation.name}" added!`);
            return true;
        }

        function showToast(msg) {
            toastMessage.textContent = msg;
            toast.show();
        }

        // ---- image preview ----
        stationImageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) {
                imagePreview.innerHTML = `<i class="bi bi-image placeholder-icon"></i>`;
                return;
            }
            const reader = new FileReader();
            reader.onload = function(ev) {
                imagePreview.innerHTML = `<img src="${ev.target.result}" alt="preview">`;
            };
            reader.readAsDataURL(file);
        });

        // ---- event binding ----
        searchBtn.addEventListener('click', () => renderPage(0));
        genreFilter.addEventListener('change', () => renderPage(0));
        countryFilter.addEventListener('input', () => { /* wait for search */ });
        searchInput.addEventListener('keyup', (e) => { if (e.key === 'Enter') renderPage(0); });

        prevPageBtn.addEventListener('click', (e) => {
            e.preventDefault();
            if (currentPage > 0) renderPage(currentPage - 1);
        });
        nextPageBtn.addEventListener('click', (e) => {
            e.preventDefault();
            const totalPages = Math.ceil(getFilteredStations().length / LIMIT);
            if (currentPage < totalPages - 1) renderPage(currentPage + 1);
        });

        playPauseBtn.addEventListener('click', togglePlayPause);
        stopBtn.addEventListener('click', stopAudio);

        volumeSlider.addEventListener('input', function() {
            if (audioElement) audioElement.volume = parseFloat(this.value);
        });

        submitStationBtn.addEventListener('click', () => {
            const name = stationNameInput.value;
            const url = stationUrlInput.value;
            const genre = stationGenreInput.value;
            const country = stationCountryInput.value;
            // get image data if any
            let imageData = null;
            const previewImg = imagePreview.querySelector('img');
            if (previewImg) {
                imageData = previewImg.src;
            }
            const ok = addStation(name, url, genre, country, imageData);
            if (ok) {
                const modal = bootstrap.Modal.getInstance(document.getElementById('addStationModal'));
                modal.hide();
                stationNameInput.value = '';
                stationUrlInput.value = '';
                stationGenreInput.value = '';
                stationCountryInput.value = '';
                stationImageInput.value = '';
                imagePreview.innerHTML = `<i class="bi bi-image placeholder-icon"></i>`;
            }
        });

        // keyboard shortcut: space
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
            if (e.code === 'Space') { e.preventDefault(); togglePlayPause(); }
        });

        // ---- init ----
        loadStations();

    })();
</script>
</body>
</html>
